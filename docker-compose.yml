services:
  # ============================================================================
  # 1. PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: mafqoodi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mafqoodi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mafqoodi_secret_password_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-mafqoodi_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mafqoodi_user} -d ${POSTGRES_DB:-mafqoodi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mafqoodi_network

  # ============================================================================
  # 2. Database Web GUI (Adminer - view/query PostgreSQL in browser)
  # ============================================================================
  adminer:
    image: adminer:latest
    container_name: mafqoodi_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mafqoodi_network

  # ============================================================================
  # 3. Backend Service (FastAPI REST API)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mafqoodi_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-mafqoodi_user}:${POSTGRES_PASSWORD:-mafqoodi_secret_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-mafqoodi_db}
      - STORAGE_BACKEND=local
      - UPLOAD_DIR=/app/uploads
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_random_secure_hex_secret_in_production}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mafqoodi_network

  # ============================================================================
  # 4. Frontend Service (Next.js Responsive Web App)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mafqoodi_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - mafqoodi_network

# ==============================================================================
# Persistent Named Volumes & Networks
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  mafqoodi_network:
    driver: bridge
